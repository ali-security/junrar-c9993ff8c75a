name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Gradle test task + selector to run instead of the full build (e.g. "test --tests FooTest")'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        java: [ 8, 11, 17, 18 ]
    name: Test JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v2
        with:
          java-version: ${{ matrix.java }}
          java-package: 'jdk'
          distribution: 'temurin'
      - name: Build
        uses: gradle/gradle-build-action@v2
        with:
          arguments: ${{ inputs.test-filter != '' && format('assemble {0}', inputs.test-filter) || 'build' }}
      - name: Test results summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for path in sorted(glob.glob('build/test-results/*/*.xml')):
              root = ET.parse(path).getroot()
              t += int(root.get('tests', 0)); f += int(root.get('failures', 0))
              e += int(root.get('errors', 0)); s += int(root.get('skipped', 0))
              for tc in root.iter('testcase'):
                  name = f"{tc.get('classname')}.{tc.get('name')}"
                  sk, fl = tc.find('skipped'), (tc.find('failure') if tc.find('failure') is not None else tc.find('error'))
                  if sk is not None:
                      print(f"SKIPPED {name}: {sk.get('message') or (sk.text or '').strip() or 'no message'}")
                  elif fl is not None:
                      print(f"FAILED  {name}: {fl.get('message')}")
                  else:
                      print(f"PASSED  {name}")
          print(f"Tests run: {t}, Passed: {t - f - e - s}, Failures: {f}, Errors: {e}, Skipped: {s}")
          PY
      - name: Build release jar
        if: matrix.java == '8'
        uses: gradle/gradle-build-action@v2
        with:
          arguments: publishToMavenLocal
      - name: Upload jar
        if: matrix.java == '8'
        uses: actions/upload-artifact@v4
        with:
          name: junrar-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
      - name: Jacoco
        uses: gradle/gradle-build-action@v2
        with:
          arguments: jacocoTestReport

  release:
    name: semantic release
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    if: false
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v2
        with:
          node-version: '16'
          cache: 'npm'
      - uses: actions/setup-java@v2
        with:
          java-version: '8'
          java-package: 'jdk'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.MAVENCENTRAL_USER }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.MAVENCENTRAL_PASSWORD }}
        run: npx semantic-release
